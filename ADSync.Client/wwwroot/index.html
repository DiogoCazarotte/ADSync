<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexService</title><meta name="theme-color" content="#08675e" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ADSync.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" aria-hidden="true" viewBox="0 0 100 100">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <p class="loading-progress-text" role="status">Carregando NexService…</p>
        <noscript>Ative o JavaScript no navegador para abrir o aplicativo.</noscript>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="storage.js"></script><script src="pwa.js"></script><script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        function showStartupError(error) {
            console.error('Falha ao iniciar NexService:', error);
            document.querySelector('.loading-progress-text').textContent =
                'Não foi possível carregar o aplicativo. Recarregue a página. Se persistir, pare a execução e inicie o cliente novamente.';
            document.getElementById('blazor-error-ui').style.display = 'block';
        }
        if (window.Blazor) Blazor.start().catch(showStartupError);
        else showStartupError('Carregador Blazor indisponível.');
    </script>
    <script>nexPwa.register();</script>
</body>

</html>
