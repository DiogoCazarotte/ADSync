<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#284c7a"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#162c48}
      .box{fill:#f4f8fc;stroke:#284c7a;stroke-width:2;rx:14}
      .choice{fill:#fff6e8;stroke:#b66b14;stroke-width:2}
      .flow{stroke:#284c7a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .label{font-size:18px}
      .small{font-size:15px;fill:#465a70}
      .title{font-size:26px;font-weight:bold}
    </style>
  </defs>
  <rect width="900" height="940" fill="white"/>
  <text x="450" y="46" text-anchor="middle" class="title">Fluxo geral de uma ordem de serviço</text>
  <rect x="310" y="78" width="280" height="66" class="box"/>
  <text x="450" y="118" text-anchor="middle" class="label">Usuário autentica-se</text>
  <path d="M450 144 V184" class="flow"/>
  <rect x="275" y="184" width="350" height="76" class="box"/>
  <text x="450" y="217" text-anchor="middle" class="label">Operador ou Gestor abre O.S.</text>
  <text x="450" y="242" text-anchor="middle" class="small">Equipamento · descrição · prioridade</text>
  <path d="M450 260 V302" class="flow"/>
  <rect x="275" y="302" width="350" height="72" class="box"/>
  <text x="450" y="331" text-anchor="middle" class="label">API valida e cria a ordem</text>
  <text x="450" y="355" text-anchor="middle" class="small">Número único · situação Aberta</text>
  <path d="M450 374 V414" class="flow"/>
  <polygon points="450,414 570,478 450,542 330,478" class="choice"/>
  <text x="450" y="472" text-anchor="middle" class="label">Há técnico ativo</text>
  <text x="450" y="496" text-anchor="middle" class="label">e elegível?</text>
  <path d="M330 478 H190 V570" class="flow"/>
  <text x="230" y="462" class="small">Não</text>
  <rect x="50" y="570" width="280" height="74" class="box"/>
  <text x="190" y="601" text-anchor="middle" class="label">Gestor atribui depois</text>
  <text x="190" y="625" text-anchor="middle" class="small">O.S. permanece sem responsável</text>
  <path d="M570 478 H710 V570" class="flow"/>
  <text x="645" y="462" class="small">Sim</text>
  <rect x="570" y="570" width="280" height="74" class="box"/>
  <text x="710" y="601" text-anchor="middle" class="label">Sistema atribui por carga</text>
  <text x="710" y="625" text-anchor="middle" class="small">Técnico ativo com menos pendências</text>
  <path d="M190 644 V700 H450 M710 644 V700 H450 V734" class="flow"/>
  <rect x="275" y="734" width="350" height="84" class="box"/>
  <text x="450" y="766" text-anchor="middle" class="label">Técnico executa atendimento</text>
  <text x="450" y="793" text-anchor="middle" class="small">Tempo · peças · causa · conclusão</text>
  <path d="M450 818 V856" class="flow"/>
  <rect x="275" y="856" width="350" height="62" class="box"/>
  <text x="450" y="884" text-anchor="middle" class="label">API confirma; Gestor acompanha</text>
  <text x="450" y="906" text-anchor="middle" class="small">Pendências offline sincronizam quando habilitadas</text>
</svg>
